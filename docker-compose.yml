name: chicago-pizza

x-server-build: &server-build
  build:
    context: ./server
    dockerfile: Dockerfile

x-server-env: &server-env
  NODE_ENV: production
  # Containers run on UTC, and the pizzeria does not. Opening hours are
  # evaluated against `BUSINESS_TIMEZONE` in code, but log timestamps and any
  # `toLocaleString` that slips in should read the same as the shop's clock.
  TZ: ${TZ:-Europe/Moscow}
  # `connection_limit` is not a tuning knob here, it is a cap that has to
  # exist. Prisma's default pool is `cpus * 2 + 1` *per process*, and six
  # services each open their own: on an 8-core host that is 17 × 6 = 102
  # connections against a Postgres whose own default `max_connections` is 100.
  # The stack would come up fine and then refuse connections under the first
  # real load, from whichever service happened to ask last.
  #
  # 8 each caps the total at 48 with room to spare for the migration job and a
  # psql session. `pool_timeout` makes a starved request fail in ten seconds
  # with a clear error instead of hanging.
  DATABASE_URL: postgresql://${POSTGRES_USER:-pizza}:${POSTGRES_PASSWORD:-pizza}@postgres:5432/${POSTGRES_DB:-chicago_pizza}?schema=public&connection_limit=8&pool_timeout=10
  # The password travels in the URL, like the other two. Redis is not published
  # to the host, so this is defence in depth rather than the only thing standing
  # in the way — but "only reachable from inside the network" is an assumption
  # about every other container, and one compromised Node process should not
  # hand over every session and every cart.
  CACHE_REDIS_URL: redis://:${REDIS_PASSWORD:-pizza}@redis-cache:6379
  REDIS_URL: redis://:${REDIS_PASSWORD:-pizza}@redis:6379
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-pizza}:${RABBITMQ_PASSWORD:-pizza}@rabbitmq:5672
  CLIENT_URL: ${CLIENT_URL:-http://localhost}

# Container logs were unbounded: a crash-looping service could fill the host
# disk, and a disk-full host takes the database down with it.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

# Memory ceilings. Nine containers share one host, and until now nothing
# stopped any of them from taking all of it — a leak or a runaway query in one
# Node service would be paid for by Postgres getting OOM-killed, which is the
# one process whose death costs data rather than a restart.
#
# A limit turns that into the leaking container dying alone and being
# restarted, which is what `restart: unless-stopped` is for. The numbers are
# defaults for a small VPS; raise them per host in `.env`.
x-node-limits: &node-limits
  deploy:
    resources:
      limits:
        memory: ${NODE_MEMORY_LIMIT:-512M}
        cpus: '${NODE_CPU_LIMIT:-1.0}'

# The gateway carries every HTTP request and every WebSocket, so it gets more
# headroom than a service that only consumes off the broker.
x-gateway-limits: &gateway-limits
  deploy:
    resources:
      limits:
        memory: ${GATEWAY_MEMORY_LIMIT:-768M}
        cpus: '${GATEWAY_CPU_LIMIT:-2.0}'

# The application containers run as one user from the first instruction to the
# last: they never change identity and never chown anything, so no capability
# is granted. `no-new-privileges` blocks the setuid step a process would need
# to regain them.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Postgres, Redis and RabbitMQ are different, and dropping every capability
# broke them.
#
# All three start as root and immediately hand off to their own unprivileged
# user — which is a privilege *reduction*, but the kernel still asks for
# CAP_SETUID/CAP_SETGID to perform it, and for CHOWN/FOWNER/DAC_OVERRIDE to
# take ownership of a fresh data volume. Without them `su-exec` fails with
# "setgroups: Operation not permitted" and the container crash-loops, so the
# blanket `cap_drop: ALL` prevented the very thing the hardening exists for.
#
# Everything else stays dropped, and `no-new-privileges` still stands: these
# five are what the startup sequence needs and nothing more.
x-stateful-hardening: &stateful-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID

x-server-depends: &server-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  # ── Infrastructure ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    <<: [*logging, *stateful-hardening]
    restart: unless-stopped
    # The stock configuration is sized for a machine from another decade:
    # `shared_buffers` defaults to 128MB regardless of how much memory the
    # host actually has. These are the four settings that matter, defaulted
    # for a small VPS (~2GB) and overridable for a larger one.
    #
    # `max_connections` is deliberately well above the 48 the services cap
    # themselves at — the headroom is what lets an operator open psql while
    # the stack is under load.
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
    # Parallel queries and hash joins spill into shared memory; the 64MB
    # Docker default is small enough that the analytics aggregations can hit it.
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pizza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pizza}
      POSTGRES_DB: ${POSTGRES_DB:-chicago_pizza}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pizza} -d ${POSTGRES_DB:-chicago_pizza}']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Loopback only. Published as 0.0.0.0 with the default password, this
      # was a Postgres open to the internet on any host with a public IP.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

  redis:
    image: redis:7-alpine
    <<: [*logging, *stateful-hardening]
    restart: unless-stopped
    # Carts, session revocations and BullMQ must never be evicted.
    # Disposable catalog/analytics entries use redis-cache instead.
    command: >
      redis-server --appendonly yes
      --requirepass ${REDIS_PASSWORD:-pizza}
      --maxmemory 320mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      # The CLI needs the password too, or the healthcheck fails the container
      # it is meant to be watching.
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-pizza}', '--no-auth-warning', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-pizza} --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-pizza}', '--no-auth-warning', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    <<: [*logging, *stateful-hardening]
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pizza}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pizza}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      # Management UI — operators reach it over an SSH tunnel, not the web.
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'

  # Local mail catcher — every outgoing email lands in its web UI instead of
  # a real inbox. Replace with real SMTP credentials in production.
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    # A development convenience. `docker compose --profile dev up` brings it
    # along; a production stack never starts it at all.
    profiles: ['dev']
    ports:
      - '127.0.0.1:${MAILHOG_UI_PORT:-8025}:8025'

  # ── Database migration / seed (runs once, then exits) ──────────
  migrate:
    <<: [*server-build, *logging, *hardening]
    environment:
      <<: *server-env
      SEED_ON_START: ${SEED_ON_START:-false}
      SEED_DEMO_ACCOUNTS: ${SEED_DEMO_ACCOUNTS:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    # The seed upserts, so re-running it silently reverts any price an admin
    # changed through the panel. It runs only when explicitly asked for.
    command: >
      sh -c "npx prisma migrate deploy --schema libs/prisma/prisma/schema.prisma &&
             if [ \"$$SEED_ON_START\" = \"true\" ]; then node libs/prisma/dist/seed.js;
             else echo 'SEED_ON_START is not true — skipping seed'; fi"
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # ── Microservices ──────────────────────────────────────────────
  auth:
    <<: [*server-build, *logging, *hardening, *node-limits]
    restart: unless-stopped
    command: ['node', 'apps/auth/dist/main.js']
    environment:
      <<: *server-env
      PORT: 3001
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
    depends_on:
      <<: *server-depends
      migrate:
        condition: service_completed_successfully
    # A pure RMQ consumer has no HTTP surface, so a wedged process stayed
    # "up" forever. Each service now answers /health/live on its own port.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3001/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  products:
    <<: [*server-build, *logging, *hardening, *node-limits]
    restart: unless-stopped
    command: ['node', 'apps/products/dist/main.js']
    environment:
      <<: *server-env
      PORT: 3002
    depends_on:
      <<: *server-depends
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3002/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  orders:
    <<: [*server-build, *logging, *hardening, *node-limits]
    restart: unless-stopped
    command: ['node', 'apps/orders/dist/main.js']
    environment:
      <<: *server-env
      PORT: 3003
      # Optional: without a merchant account online payment is not offered and
      # the checkout refuses it, leaving payment on delivery as it was.
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_RECEIPT_ENABLED: ${YOOKASSA_RECEIPT_ENABLED:-false}
      YOOKASSA_VAT_CODE: ${YOOKASSA_VAT_CODE:-}
      YOOKASSA_TAX_SYSTEM_CODE: ${YOOKASSA_TAX_SYSTEM_CODE:-}
    depends_on:
      <<: *server-depends
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3003/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  notifications:
    <<: [*server-build, *logging, *hardening, *node-limits]
    restart: unless-stopped
    command: ['node', 'apps/notifications/dist/main.js']
    environment:
      <<: *server-env
      PORT: 3004
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Chicago Pizza <no-reply@chicago-pizza.ru>}
      # Optional: without a pair the browser toggle is simply not offered.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@chicago-pizza.ru}
    depends_on:
      <<: *server-depends
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3004/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  support:
    <<: [*server-build, *logging, *hardening, *node-limits]
    restart: unless-stopped
    command: ['node', 'apps/support/dist/main.js']
    environment:
      <<: *server-env
      PORT: 3005
    depends_on:
      <<: *server-depends
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3005/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  gateway:
    <<: [*server-build, *logging, *hardening, *gateway-limits]
    restart: unless-stopped
    command: ['node', 'apps/gateway/dist/main.js']
    environment:
      <<: *server-env
      PORT: 4000
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      THROTTLE_TTL_SECONDS: ${THROTTLE_TTL_SECONDS:-60}
    depends_on:
      <<: *server-depends
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:4000/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Frontend ───────────────────────────────────────────────────
  client:
    <<: [*logging, *hardening, *gateway-limits]
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
        NEXT_PUBLIC_2GIS_MAP_KEY: ${NEXT_PUBLIC_2GIS_MAP_KEY:-}
        BUILD_ID: ${BUILD_ID:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server Components call the gateway directly over the compose network,
      # bypassing Nginx.
      INTERNAL_API_URL: http://gateway:4000/api
    depends_on:
      gateway:
        condition: service_started

  # ── Reverse proxy ──────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    <<: *logging
    # nginx writes its pid and temp files, so it keeps a writable root; it
    # does need to bind :80 and :443, which is why NET_BIND_SERVICE stays.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      # The TLS config names the certificate directory after the domain. The
      # nginx image substitutes it into the template on start; the filter
      # keeps envsubst away from nginx's own `$host`/`$request_uri`.
      DOMAIN: ${DOMAIN:-localhost}
      # Edge requests per second per IP. envsubst has no default syntax, so
      # the default lives here; see the note in the nginx config for why the
      # E2E job is the one thing that raises it.
      API_RATE_LIMIT: ${API_RATE_LIMIT:-10}
      NGINX_ENVSUBST_FILTER: (DOMAIN|API_RATE_LIMIT)
    volumes:
      # NGINX_CONF selects the front end: plain HTTP by default, TLS in
      # production. Both pull their routing from the same snippets.
      - ./infra/nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/templates/default.conf.template:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - gateway
      - client

  # Renews the Let's Encrypt certificate every 12 hours and exits quietly when
  # there is nothing to renew. Issuing the *first* certificate is a one-off
  # command — see "HTTPS" in the README.
  certbot:
    image: certbot/certbot:latest
    profiles: ['tls']
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  certbot_conf:
  certbot_www:
