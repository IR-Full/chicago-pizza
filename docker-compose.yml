name: chicago-pizza

x-server-build: &server-build
  build:
    context: ./server
    dockerfile: Dockerfile

x-server-env: &server-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-pizza}:${POSTGRES_PASSWORD:-pizza}@postgres:5432/${POSTGRES_DB:-chicago_pizza}?schema=public
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-pizza}:${RABBITMQ_PASSWORD:-pizza}@rabbitmq:5672
  CLIENT_URL: ${CLIENT_URL:-http://localhost}

x-server-depends: &server-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  # ── Infrastructure ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pizza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pizza}
      POSTGRES_DB: ${POSTGRES_DB:-chicago_pizza}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pizza} -d ${POSTGRES_DB:-chicago_pizza}']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '${POSTGRES_PORT:-5432}:5432'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pizza}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pizza}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'

  # Local mail catcher — every outgoing email lands in its web UI instead of
  # a real inbox. Replace with real SMTP credentials in production.
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - '${MAILHOG_UI_PORT:-8025}:8025'

  # ── Database migration / seed (runs once, then exits) ──────────
  migrate:
    <<: *server-build
    environment:
      <<: *server-env
    command: >
      sh -c "npx prisma migrate deploy --schema libs/prisma/prisma/schema.prisma &&
             node libs/prisma/dist/seed.js"
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # ── Microservices ──────────────────────────────────────────────
  auth:
    <<: *server-build
    restart: unless-stopped
    command: ['node', 'apps/auth/dist/main.js']
    environment:
      <<: *server-env
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
    depends_on:
      <<: *server-depends
      migrate:
        condition: service_completed_successfully

  products:
    <<: *server-build
    restart: unless-stopped
    command: ['node', 'apps/products/dist/main.js']
    environment:
      <<: *server-env
    depends_on:
      <<: *server-depends
      migrate:
        condition: service_completed_successfully

  orders:
    <<: *server-build
    restart: unless-stopped
    command: ['node', 'apps/orders/dist/main.js']
    environment:
      <<: *server-env
    depends_on:
      <<: *server-depends
      migrate:
        condition: service_completed_successfully

  notifications:
    <<: *server-build
    restart: unless-stopped
    command: ['node', 'apps/notifications/dist/main.js']
    environment:
      <<: *server-env
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Chicago Pizza <no-reply@chicago-pizza.ru>}
    depends_on:
      <<: *server-depends
      migrate:
        condition: service_completed_successfully

  support:
    <<: *server-build
    restart: unless-stopped
    command: ['node', 'apps/support/dist/main.js']
    environment:
      <<: *server-env
    depends_on:
      <<: *server-depends
      migrate:
        condition: service_completed_successfully

  gateway:
    <<: *server-build
    restart: unless-stopped
    command: ['node', 'apps/gateway/dist/main.js']
    environment:
      <<: *server-env
      PORT: 4000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      THROTTLE_TTL_SECONDS: ${THROTTLE_TTL_SECONDS:-60}
    depends_on:
      <<: *server-depends
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:4000/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Frontend ───────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server Components call the gateway directly over the compose network,
      # bypassing Nginx.
      INTERNAL_API_URL: http://gateway:4000/api
    depends_on:
      gateway:
        condition: service_started

  # ── Reverse proxy ──────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
      - client

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
