name: Publish deployment images
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Public HTTPS URL without trailing slash
        required: true
      map_key:
        description: Optional public 2GIS map key
        required: false
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deployment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify backup alert behavior
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify server before publication
        working-directory: server
        run: |
          npm ci
          npm run build
          npm run lint
          npm test
      - name: Verify actual PostgreSQL invariants before publication
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deployment_test
        run: |
          npx prisma migrate deploy --schema=libs/prisma/prisma/schema.prisma
          node ops/verify-db-invariants.cjs
      - name: Verify client before publication
        working-directory: client
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate URL and normalize image names
        id: names
        env:
          REPO: ${{ github.repository }}
          SITE_URL: ${{ inputs.site_url }}
        run: |
          case "$SITE_URL" in https://*) ;; *) echo 'HTTPS required'; exit 1 ;; esac
          echo "repo=${REPO,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ghcr.io/${{ steps.names.outputs.repo }}-server:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: ghcr.io/${{ steps.names.outputs.repo }}-client:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ inputs.site_url }}
            NEXT_PUBLIC_API_URL=${{ inputs.site_url }}/api
            NEXT_PUBLIC_WS_URL=${{ inputs.site_url }}
            NEXT_PUBLIC_2GIS_MAP_KEY=${{ inputs.map_key }}
            BUILD_ID=${{ github.sha }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
      - name: Publish isolated backup worker
        uses: docker/build-push-action@v6
        with:
          context: ./scripts
          file: ./scripts/Dockerfile.backups
          push: true
          tags: ghcr.io/${{ steps.names.outputs.repo }}-backups:${{ github.sha }}
          cache-from: type=gha,scope=backups
          cache-to: type=gha,mode=max,scope=backups
