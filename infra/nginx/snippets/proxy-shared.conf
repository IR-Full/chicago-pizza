# Directives that belong to the `http` context, shared by the plain-HTTP and
# the TLS front end so the two cannot drift apart. Included *outside* any
# `server { }` block.

# Whether a request is a protocol upgrade, and what `Connection` should say.
#
# The routing snippet used to send a literal `Connection: upgrade` on every
# request to Next, including ordinary page loads. nginx drops a header whose
# value is empty, so `$http_upgrade` being blank made this benign rather than
# broken — but "benign by accident" is not the same as correct, and an upstream
# is entitled to take the header at its word.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Edge cache for Next's build output.
#
# Everything under /_next/static/ is content-hashed and immutable: the file at
# a given URL never changes, and a new build produces new URLs. Next already
# says so in its own `Cache-Control: public, max-age=31536000, immutable`, so
# browsers were caching correctly — but every *cold* client, every crawler and
# every visitor whose cache had been evicted still made the request travel all
# the way into the Node process, which does nothing with it but read a file
# off disk.
#
# Caching it here means the second request for a chunk is answered by nginx and
# never reaches the application at all. 1GB is far more than one build's output;
# `inactive=30d` is what keeps the previous build's chunks around for clients
# mid-navigation across a deploy.
proxy_cache_path /var/cache/nginx/next_static
                 levels=1:2
                 keys_zone=next_static:10m
                 max_size=1g
                 inactive=30d
                 use_temp_path=off;
