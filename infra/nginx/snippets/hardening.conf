# Server-level hardening shared by the plain-HTTP and the TLS configuration.
# Included inside a `server { }` block, so every directive here must be legal
# at server level.

# Do not advertise the exact nginx version in responses and error pages —
# it is free reconnaissance for anyone scanning for a known nginx CVE.
server_tokens off;

client_max_body_size 5m;

# Slowloris: a client that opens a connection and then dribbles out one byte
# every few seconds used to hold a worker slot indefinitely. These caps make
# an idle or deliberately slow request give up instead.
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;
keepalive_timeout 65s;

# One client cannot monopolise the worker pool.
limit_conn per_ip 50;

# Security headers that apply to every response, including static assets
# served by Next.js. The Content-Security-Policy is deliberately *not* here:
# it is emitted by Next itself (client/next.config.mjs), because only the app
# knows which origins its own bundle talks to.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

gzip on;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
gzip_min_length 1024;
gzip_vary on;
