# Routing shared by the plain-HTTP and the TLS configuration, so the two can
# never drift apart. Included inside a `server { }` block.

# Docker's embedded DNS. Combined with the variables below, this makes
# Nginx re-resolve backends at request time instead of caching the IP
# from startup — otherwise recreating a container (deploy, scale, restart)
# leaves Nginx serving 502 against a dead address until it is reloaded.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

set $gateway_upstream "gateway:4000";
set $client_upstream  "client:3000";

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# The gateway derives `req.ip` and its rate-limit key from this, and marks
# cookies Secure based on the scheme the browser actually used.
proxy_set_header X-Forwarded-Proto $scheme;

# ── REST API ──────────────────────────────────────────────
location /api/ {
    limit_req zone=api_limit burst=20 nodelay;

    # No URI part after the variable: the original request URI (including
    # the /api prefix the gateway expects) is forwarded unchanged.
    proxy_pass http://$gateway_upstream;
    proxy_read_timeout 60s;
}

location /health/ {
    proxy_pass http://$gateway_upstream;
    access_log off;
}

# ── WebSocket (Socket.IO) ─────────────────────────────────
location /socket.io/ {
    proxy_pass http://$gateway_upstream;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # Long-lived connections must not be cut by the default 60s timeout.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ── Next.js frontend ──────────────────────────────────────
location / {
    proxy_pass http://$client_upstream;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
