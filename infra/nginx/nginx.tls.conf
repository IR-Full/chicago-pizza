# TLS front end for production.
#
# Enable it by setting these in `.env` and recreating the nginx container:
#
#   NGINX_CONF=nginx.tls.conf
#   DOMAIN=chicago-pizza.ru
#   CLIENT_URL=https://chicago-pizza.ru
#   NEXT_PUBLIC_API_URL=https://chicago-pizza.ru/api
#   NEXT_PUBLIC_WS_URL=https://chicago-pizza.ru
#
# Issue the first certificate before switching (the `tls` profile carries a
# certbot container; see the README). Until a certificate exists nginx will
# refuse to start with this file, which is the intended failure: serving the
# login form over plain HTTP silently is worse.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

# ── Port 80: ACME challenges, everything else redirected ──────────
server {
    listen 80;
    server_name ${DOMAIN};

    server_tokens off;

    # Let's Encrypt writes its challenge files here; this must stay on plain
    # HTTP, so it is the one path that is not redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# ── Port 443: the application ─────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # TLS 1.2 is kept for older Android handsets, which are common in the
    # delivery audience; everything below it is off.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling keeps the handshake from making the browser fetch the
    # revocation status itself.
    ssl_stapling on;
    ssl_stapling_verify on;

    include /etc/nginx/snippets/hardening.conf;

    # Two years, subdomains included. Only meaningful over TLS, which is why
    # it lives here and not in the shared hardening snippet.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    include /etc/nginx/snippets/app-locations.conf;
}
