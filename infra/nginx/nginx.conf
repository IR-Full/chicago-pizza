# Plain-HTTP front end — the default, used for local development and CI.
#
# Production terminates TLS: set `NGINX_CONF=nginx.tls.conf` in `.env` and
# follow the certificate steps in the README. Everything except the listener
# and the TLS parameters is shared through `snippets/`, so the two
# configurations cannot drift apart.

# Limits requests per IP at the edge, in front of the app-level throttler.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/hardening.conf;
    include /etc/nginx/snippets/app-locations.conf;
}
