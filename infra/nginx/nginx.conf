# Plain-HTTP front end — the default, used for local development and CI.
#
# Production terminates TLS: set `NGINX_CONF=nginx.tls.conf` in `.env` and
# follow the certificate steps in the README. Everything except the listener
# and the TLS parameters is shared through `snippets/`, so the two
# configurations cannot drift apart.

# Limits requests per IP at the edge, in front of the app-level throttler.
#
# `API_RATE_LIMIT` is a knob, not a suggestion — compose supplies the default
# (10), and the only thing expected to raise it is the end-to-end job, which
# drives the whole checkout from one address at machine speed. A page here
# fans out to seven or eight API calls, so a test runner looks exactly like
# abuse to a counter keyed on $binary_remote_addr, and the limiter is not the
# thing those tests are there to exercise.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=${API_RATE_LIMIT}r/s;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

include /etc/nginx/snippets/proxy-shared.conf;

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/hardening.conf;
    include /etc/nginx/snippets/app-locations.conf;
}
