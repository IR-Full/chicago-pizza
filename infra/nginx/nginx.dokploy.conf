# Dokploy Traefik owns public ports and TLS; nginx has no published host ports.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=${API_RATE_LIMIT}r/s;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;
include /etc/nginx/snippets/proxy-shared.conf;
server {
    listen 80;
    server_name _;
    # Narrow to the dokploy-network subnet after installation, especially on
    # hosts with other tenants. Traefik must sanitize incoming forwarded headers.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    include /etc/nginx/snippets/hardening.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/app-locations.dokploy.conf;
}
